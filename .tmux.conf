# CAPSLOCK is remapped to Ctrl at OS level.
# Linux: via keyd, installed by bootstrap.sh.
# macOS: not scriptable — set it by hand in
#   System Settings > Keyboard > Keyboard Shortcuts > Modifier Keys > Caps Lock > Control
# prefix is Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# sensible defaults
set -g default-terminal "tmux-256color"
# -u resets to the built-in default first, so that re-sourcing this file
# (prefix + r) does not append another copy. -a appends unconditionally.
set -su terminal-overrides
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -s escape-time 0
set -g history-limit 10000
set -g focus-events on

# Ctrl+<digit> is not encodable in legacy terminal input; it needs the
# kitty keyboard protocol / CSI-u. Required for the C-1..C-5 bindings below.
set -g extended-keys on
# Reset first, same reason as terminal-overrides above.
set -gu terminal-features
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features 'xterm-kitty:extkeys'
set -as terminal-features 'xterm-256color:extkeys'

# vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Also override the default split keys so muscle memory keeps the path;
# without -c they open in the tmux server's start dir, not the pane's cwd.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# window navigation with Ctrl+number (CapsLock = Ctrl, see top of file)
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5

# pane navigation (prefix + hjkl)
# Deliberately NOT bound with -n: prefix-less C-h/C-j/C-k/C-l would swallow
# those keys in every program running inside tmux, breaking Ctrl+L (clear)
# and Ctrl+K (kill-to-end-of-line) in the shell and in editors.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# status bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S  "
set -g status-right "#[fg=#a6adc8] %H:%M  %d %b "
set -g window-status-format "#[fg=#585b70] #I:#W "
set -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
